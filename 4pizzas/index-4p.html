        * {

            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-volver {
            background-color: #ffffff;
            color: var(--primary-red);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 12px;
            text-decoration: none;
            transition: background-color 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .btn-volver:hover {
            background-color: #fff0f0;
        }

        .select-idioma {
            background-color: var(--primary-red);
            color: var(--text-white);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid var(--text-white);
            outline: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text-white);
        }

        header h1 span {
            color: var(--primary-red);
        }

        header p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .score-board span span {
            color: var(--text-white);
        }

        /* OPCIONES DE COMPARACIÓN */
        .versus-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            margin-bottom: 20px;
        }

        .option-card {
            background-color: #222222;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 20px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 110px;
            position: relative;
        }

        .option-card:hover {
            border-color: var(--primary-red);
            transform: translateY(-2px);
            background-color: #282828;
        }

        .option-emoji {
            font-size: 2.2rem;
            margin-bottom: 6px;
        }

        .option-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-white);
            line-height: 1.3;
        }

        .option-weight {
            margin-top: 8px;
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--primary-red);
            display: none;
        }

        .vs-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--primary-red);
            color: var(--text-white);
            font-weight: 900;
            font-size: 0.85rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--card-bg);
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.6);
            z-index: 5;
        }

        /* FEEDBACK DE RESPUESTA */
        .feedback-box {
            display: none;
            width: 100%;
            text-align: center;
            margin-bottom: 16px;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .feedback-correct {
            background: rgba(46, 204, 113, 0.15);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }

        .feedback-incorrect {
            background: rgba(231, 76, 60, 0.15);
            color: var(--error-red);
            border: 1px solid var(--error-red);
        }

        .btn {
            background-color: var(--primary-red);
            color: var(--text-white);
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 42, 42, 0.4);
            display: none;
        }

        .btn:hover {
            background-color: var(--primary-red-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* PANTALLA FINAL */
        .final-screen-badge {
            background: linear-gradient(135deg, rgba(255, 42, 42, 0.15), rgba(255, 42, 42, 0.05));
            border: 2px solid var(--primary-red);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 42, 42, 0.2);

        }

        .final-subtitle {

            font-size: 0.95rem;
            margin-bottom: 20px;
            text-align: center;

        let currentRound = 1;
        let totalScore = 0;
        let optionA = null;
        let optionB = null;
        let answered = false;

        function cambiarIdioma(lang) {
            localStorage.setItem('whenwastimeline_idioma', lang);
            aplicarTextosUI(lang);
        }

        function aplicarTextosUI(lang) {
            const t = i18nHH[lang] || i18nHH.es;
            document.getElementById('select-idioma').value = lang;
            document.getElementById('txt-volver').textContent = t.volver;
            document.getElementById('txt-subtitulo').textContent = t.subtitulo;
            document.getElementById('lbl-ronda').childNodes[0].textContent = t.ronda + " ";
            document.getElementById('lbl-puntuacion').childNodes[0].textContent = t.aciertos + " ";
            document.getElementById('next-btn').textContent = t.siguiente;
            document.getElementById('restart-btn').textContent = t.jugarOtraVez;
            
            if (optionA && optionB) {
                document.getElementById('title-0').textContent = optionA.name[lang] || optionA.name.es;
                document.getElementById('title-1').textContent = optionB.name[lang] || optionB.name.es;
            }
        }

        function formatWeight(kg) {
            if (kg >= 1000000) {
                return (kg / 1000000).toLocaleString() + " Mill. kg";
            } else if (kg >= 1000) {
                return kg.toLocaleString() + " kg";
            } else if (kg < 0.1) {
                return kg + " kg";
            } else {
                return kg + " kg";
            }
        }

        function initGame() {
            currentRound = 1;
            totalScore = 0;
            document.getElementById('game-interface').style.display = 'block';
            document.getElementById('result-interface').style.display = 'none';
            loadRound();
        }

        function getRandomItems() {
            let idx1, idx2;
            do {
                idx1 = Math.floor(Math.random() * itemsDB.length);
                idx2 = Math.floor(Math.random() * itemsDB.length);
            } while (idx1 === idx2 || itemsDB[idx1].weight === itemsDB[idx2].weight);

            return [itemsDB[idx1], itemsDB[idx2]];
        }

        function loadRound() {
            answered = false;
            const lang = localStorage.getItem('whenwastimeline_idioma') || 'es';

            document.getElementById('round-num').textContent = currentRound;
            document.getElementById('total-score').textContent = totalScore;
            document.getElementById('feedback-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            for (let i = 0; i < 2; i++) {
                const card = document.getElementById(`card-${i}`);
                card.style.borderColor = 'var(--border-color)';
                card.style.cursor = 'pointer';
                document.getElementById(`weight-${i}`).style.display = 'none';
            }

            const pair = getRandomItems();
            optionA = pair[0];
            optionB = pair[1];

            document.getElementById('emoji-0').textContent = optionA.emoji;
            document.getElementById('title-0').textContent = optionA.name[lang] || optionA.name.es;
            document.getElementById('weight-0').textContent = formatWeight(optionA.weight);

            document.getElementById('emoji-1').textContent = optionB.emoji;
            document.getElementById('title-1').textContent = optionB.name[lang] || optionB.name.es;
            document.getElementById('weight-1').textContent = formatWeight(optionB.weight);
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const lang = localStorage.getItem('whenwastimeline_idioma') || 'es';
            const t = i18nHH[lang] || i18nHH.es;

            const selectedItem = selectedIndex === 0 ? optionA : optionB;
            const otherItem = selectedIndex === 0 ? optionB : optionA;

            const isCorrect = selectedItem.weight > otherItem.weight;

            if (isCorrect) {
                totalScore++;
                document.getElementById('total-score').textContent = totalScore;
            }

            document.getElementById('weight-0').style.display = 'block';
            document.getElementById('weight-1').style.display = 'block';

            document.getElementById('card-0').style.cursor = 'default';
            document.getElementById('card-1').style.cursor = 'default';

            const winningIndex = optionA.weight > optionB.weight ? 0 : 1;
            document.getElementById(`card-${winningIndex}`).style.borderColor = 'var(--success-green)';
            document.getElementById(`card-${1 - winningIndex}`).style.borderColor = 'var(--error-red)';

            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.style.display = 'block';
            if (isCorrect) {
                feedbackBox.className = 'feedback-box feedback-correct';
                feedbackBox.textContent = t.correcto;
            } else {
                feedbackBox.className = 'feedback-box feedback-incorrect';
                feedbackBox.textContent = t.incorrecto;
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextRound() {
            currentRound++;
            if (currentRound > 5) {
                endGame();
            } else {
                loadRound();
            }
        }

        function endGame() {
            const lang = localStorage.getItem('whenwastimeline_idioma') || 'es';
            const t = i18nHH[lang] || i18nHH.es;

            document.getElementById('game-interface').style.display = 'none';
            document.getElementById('result-interface').style.display = 'block';

            document.getElementById('final-score').textContent = `${totalScore} / 5`;
            document.getElementById('final-rank').textContent = t.ranks[totalScore] || t.ranks[0];
            document.getElementById('final-desc').textContent = t.completado;
        }

        window.onload = () => {
            const langGuardado = localStorage.getItem('whenwastimeline_idioma') || 'es';
            aplicarTextosUI(langGuardado);
            initGame();
        };
    </script>
