            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* BARRA SUPERIOR (VOLVER Y SELECTOR) */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-volver {
            background-color: #ffffff;
            color: var(--primary-red);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 12px;
            text-decoration: none;
            transition: background-color 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .btn-volver:hover {
            background-color: #fff0f0;
        }

        .select-idioma {
            background-color: var(--primary-red);
            color: var(--text-white);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid var(--text-white);
            outline: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--text-white);
        }

        header h1 span {
            color: var(--primary-red);
        }

        header p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .score-board span span {
            color: var(--text-white);
        }

        .event-image-container {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .event-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .event-title {
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        /* Estilo del Slider Avanzado */
        .slider-section {
            width: 100%;
            margin-bottom: 24px;
        }

        .value-display {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-red);
            margin-bottom: 12px;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--primary-red);
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .scale-markers {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 8px;
            padding: 0 2px;
            width: 100%;
        }

        /* Botón de Acción */
        .btn {
            background-color: var(--primary-red);
            color: var(--text-white);
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 42, 42, 0.4);
        }

        .btn:hover {
            background-color: var(--primary-red-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Pantalla de Resultados */
        .result-box {
            display: none;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-diff {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-gray);
        }

        .result-diff span {
            font-weight: 700;
            color: var(--text-white);
        }

        .points-earned {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary-red);
            margin-bottom: 20px;
        }

        .actual-value-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .actual-value-card b {
            color: var(--primary-red);
            font-size: 1.2rem;
        }

        /* Estilos para la Pantalla Final */
        .final-screen-badge {
            background: linear-gradient(135deg, rgba(255, 42, 42, 0.15), rgba(255, 42, 42, 0.05));
            border: 2px solid var(--primary-red);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(255, 42, 42, 0.2);
        }

        .final-screen-badge i {
            font-size: 2.5rem;
            color: var(--primary-red);
            margin-bottom: 10px;
        }

        .final-screen-badge h3 {
            font-size: 1.2rem;

            letter-spacing: 1px;
            color: var(--text-gray);
            margin-bottom: 5px;

            font-size: 3rem;

            color: var(--primary-red);
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
        }

            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 20px;

        let currentRound = 1;
        let totalScore = 0;
        let currentGameEvents = [];
        let activeEvent = null;

        const slider = document.getElementById('rare-slider');
        const sliderValDisplay = document.getElementById('slider-val-display');
        const eventTitle = document.getElementById('event-title');
        const eventImg = document.getElementById('event-img');
        const guessBtn = document.getElementById('guess-btn');
        const nextBtn = document.getElementById('next-btn');
        
        const gameInterface = document.getElementById('game-interface');
        const resultInterface = document.getElementById('result-interface');
        
        const roundNumEl = document.getElementById('round-num');
        const totalScoreEl = document.getElementById('total-score');
        const diffValueEl = document.getElementById('diff-value');
        const pointsEarnedEl = document.getElementById('points-earned');
        const realValueDisplay = document.getElementById('real-value-display');
        const resultHeaderText = document.getElementById('result-header-text');
        const actualCardBox = document.getElementById('actual-card-box');

        function cambiarIdioma(lang) {
            localStorage.setItem('whenwastimeline_idioma', lang);
            aplicarTextosUI(lang);
        }

        function aplicarTextosUI(lang) {
            const t = i18nHR[lang] || i18nHR.en;
            document.getElementById('select-idioma').value = lang;
            document.getElementById('txt-volver').textContent = t.volver;
            document.getElementById('txt-subtitulo').textContent = t.subtitulo;
            document.getElementById('lbl-ronda').childNodes[0].textContent = t.ronda + " ";
            document.getElementById('lbl-puntuacion').childNodes[0].textContent = t.puntuacion + " ";
            document.getElementById('lbl-imposible').textContent = t.imposible;
            document.getElementById('lbl-seguro').textContent = t.seguro;
            document.getElementById('guess-btn').textContent = t.comprobar;

            if (activeEvent) {
                eventTitle.textContent = activeEvent.title[lang] || activeEvent.title.en;
            }
        }

        function sliderToPercentage(val) {
            let v = parseInt(val);
            if (v <= 500) {
                return (v / 500) * 1.0;
            } else {
                let normalized = (v - 500) / 500;
                return 1.0 + Math.pow(normalized, 2) * 99.0;
            }
        }

        function percentageToSlider(percentage) {
            let p = parseFloat(percentage);
            if (p <= 1.0) {
                return (p / 1.0) * 500;
            } else {
                let normalized = Math.sqrt((p - 1.0) / 99.0);
                return 500 + (normalized * 500);
            }
        }

        slider.addEventListener('input', () => {
            let realVal = sliderToPercentage(slider.value);
            if (realVal < 0.01) {
                sliderValDisplay.textContent = realVal.toFixed(4) + "%";
            } else if (realVal < 1) {
                sliderValDisplay.textContent = realVal.toFixed(3) + "%";
            } else if (realVal < 10) {
                sliderValDisplay.textContent = realVal.toFixed(2) + "%";
            } else {
                sliderValDisplay.textContent = realVal.toFixed(1) + "%";
            }
        });

        function initGame() {
            currentRound = 1;
            totalScore = 0;
            currentGameEvents = [...eventsDB].sort(() => Math.random() - 0.5);
            loadRound();
        }

        function loadRound() {
            const lang = localStorage.getItem('whenwastimeline_idioma') || 'en';
            const t = i18nHR[lang] || i18nHR.en;

            if (currentRound > 5) {
                gameInterface.style.display = "none";
                resultInterface.style.display = "block";
                
                let tierTitle = "";
                let tierIcon = "";
                
                if (totalScore >= 4500) {
                    tierTitle = t.tiers.t1;
                    tierIcon = "fa-crown";
                } else if (totalScore >= 3500) {
                    tierTitle = t.tiers.t2;
                    tierIcon = "fa-fire";
                } else if (totalScore >= 2500) {
                    tierTitle = t.tiers.t3;
                    tierIcon = "fa-chart-line";
                } else if (totalScore >= 1500) {
                    tierTitle = t.tiers.t4;
                    tierIcon = "fa-user";
                } else {
                    tierTitle = t.tiers.t5;
                    tierIcon = "fa-seedling";
                }

                resultHeaderText.style.display = "none";
                diffValueEl.parentElement.style.display = "none";
                
                pointsEarnedEl.innerHTML = `
                    <div class="final-screen-badge">
                        <i class="fa-solid ${tierIcon}"></i>
                        <h3>${t.clasificacionGlobal}</h3>
                        <div class="player-tier">${tierTitle}</div>
                    </div>
                    <div class="final-score-big">${totalScore} PTS</div>
                    <div class="final-subtitle">${t.acumulado}</div>
                `;
                
                actualCardBox.innerHTML = t.completado;
                
                nextBtn.textContent = t.jugarOtraVez;
                nextBtn.onclick = initGame;
                return;
            }

            resultHeaderText.style.display = "block";
            resultHeaderText.textContent = t.desvio;
            diffValueEl.parentElement.style.display = "block";
            actualCardBox.style.display = "block";
            gameInterface.style.display = "block";
            resultInterface.style.display = "none";
            
            roundNumEl.textContent = currentRound;
            totalScoreEl.textContent = totalScore;

            activeEvent = currentGameEvents[currentRound - 1];
            eventTitle.textContent = activeEvent.title[lang] || activeEvent.title.en;
            eventImg.src = activeEvent.img;

            slider.value = 500;
            slider.dispatchEvent(new Event('input'));
        }

        guessBtn.addEventListener('click', () => {
            const lang = localStorage.getItem('whenwastimeline_idioma') || 'en';
            const t = i18nHR[lang] || i18nHR.en;

            let userGuessPercentage = sliderToPercentage(slider.value);
            let actualPercentage = activeEvent.real;

            let userSliderPos = parseFloat(slider.value);
            let actualSliderPos = percentageToSlider(actualPercentage);

            let sliderError = Math.abs(userSliderPos - actualSliderPos);
            
            let maxPoints = 1000;
            let roundPoints = Math.max(0, Math.round(maxPoints * (1 - Math.min(sliderError / 150, 1))));

            totalScore += roundPoints;

            let numDiff = Math.abs(userGuessPercentage - actualPercentage);

            gameInterface.style.display = "none";
            resultInterface.style.display = "block";
            
            resultHeaderText.style.display = "block";
            resultHeaderText.textContent = t.desvio;
            diffValueEl.parentElement.style.display = "block";
            diffValueEl.textContent = numDiff < 0.01 ? numDiff.toFixed(4) + "%" : numDiff.toFixed(2) + "%";
            pointsEarnedEl.textContent = `+${roundPoints} ${t.puntosGanados}`;
            
            actualCardBox.innerHTML = `${t.porcentajeReal} <br><b>${actualPercentage}%</b>`;

            currentRound++;
            nextBtn.textContent = t.siguiente;
            nextBtn.onclick = loadRound;
        });

        window.onload = () => {
            const langGuardado = localStorage.getItem('whenwastimeline_idioma') || 'en';
            aplicarTextosUI(langGuardado);
            initGame();
        };
    </script>
