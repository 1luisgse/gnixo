        let juegoTerminado = false;

        function obtenerIdiomaActual() {
            return localStorage.getItem('real_idioma') || 'en';
        }

        function cambiarIdioma(lang) {
            localStorage.setItem('real_idioma', lang);
            actualizarTextosUI();
        }

        function actualizarTextosUI() {
            const lang = obtenerIdiomaActual();
            const t = i18n[lang];

            document.getElementById('select-idioma').value = lang;
            document.getElementById('instruccion-ronda').textContent = t.instruccion;
            document.getElementById('txt-badge-modo').textContent = t.modo;
            document.getElementById('txt-btn-reintentar').textContent = t.reintentar;
            document.getElementById('txt-btn-compartir').textContent = t.compartir;
            document.getElementById('txt-gameover-titulo').textContent = t.gameOverTitulo;
            document.getElementById('txt-gameover-sub').textContent = t.gameOverSub;

            if (partidaActual.opcionesOriginales) {
                partidaActual.opcionesOriginales.items.forEach((item, i) => {
                    const textoSpan = document.getElementById(`texto-opcion-${i}`);
                    if (textoSpan) {
                        textoSpan.textContent = item.obj[lang] || item.obj.en;
                    }
                });
            }

            if (!document.getElementById('gameover-container').classList.contains('hidden')) {
                actualizarNotaUI(puntuacionAciertos, t);
            }
        }

        function reiniciarPartidaCompleta() {
            puntuacionAciertos = 0;
            document.getElementById('puntuacion-actual').textContent = puntuacionAciertos;
            document.getElementById('gameover-container').classList.add('hidden');
            document.getElementById('opciones-container').classList.remove('hidden');
            
            iniciarCronometro();
            iniciarNuevaRonda();
        }

        function iniciarNuevaRonda() {
            juegoTerminado = false;
            const realesCopia = [...bancoMasivoGlobal.reales].sort(() => Math.random() - 0.5);
            const falsosCopia = [...bancoMasivoGlobal.falsos].sort(() => Math.random() - 0.5);

            const realItem = realesCopia[0];
            const falso1 = falsosCopia[0];
            const falso2 = falsosCopia[1];

            let itemsConstruidos = [
                { obj: realItem, real: true },
                { obj: falso1, real: false },
                { obj: falso2, real: false }
            ];

            itemsConstruidos.sort(() => Math.random() - 0.5);

            partidaActual.opcionesOriginales = { items: itemsConstruidos };
            partidaActual.indiceReal = itemsConstruidos.findIndex(o => o.real);

            renderizarOpciones();
        }

        function renderizarOpciones() {
            const lang = obtenerIdiomaActual();
            const container = document.getElementById('opciones-container');
            container.innerHTML = '';

            partidaActual.opcionesOriginales.items.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.id = `btn-opcion-${index}`;
                btn.className = `w-full text-left p-4 rounded-xl game-item text-xs font-semibold leading-relaxed cursor-pointer flex items-start gap-3 text-white`;
                btn.innerHTML = `
                    <span class="font-bold text-white text-sm shrink-0 font-mono opacity-80">0${index + 1}</span> 
                    <span id="texto-opcion-${index}" class="text-white">${item.obj[lang] || item.obj.en}</span>
                `;
                btn.onclick = () => seleccionarOpcion(index);
                container.appendChild(btn);
            });
        }

        function seleccionarOpcion(index) {
            if (juegoTerminado) return;
            juegoTerminado = true;

            const esCorrecto = (index === partidaActual.indiceReal);

            for (let i = 0; i < 3; i++) {
                const botonEl = document.getElementById(`btn-opcion-${i}`);
                botonEl.style.pointerEvents = 'none';
                
                if (i === partidaActual.indiceReal) {
                    botonEl.style.borderColor = '#ffffff';
                    botonEl.style.backgroundColor = '#065f46';
                } else if (i === index && !esCorrecto) {
                    botonEl.style.borderColor = '#ffffff';
                    botonEl.style.backgroundColor = '#450a0a';
                    botonEl.classList.add('animate-shake');
                } else {
                    botonEl.style.opacity = '0.3';
                }
            }

            if (esCorrecto) {
                puntuacionAciertos++;
                document.getElementById('puntuacion-actual').textContent = puntuacionAciertos;
                actualizarRacha(true);

                setTimeout(() => {
                    iniciarNuevaRonda();
                }, 900);
            } else {
                actualizarRacha(false);
                detenerCronometro();

                setTimeout(() => {
                    mostrarPantallaGameOver();
                }, 1100);
            }
        }

        function actualizarNotaUI(aciertos, t) {
            let notaKey = 'd';
            if (aciertos >= 15) notaKey = 's';
            else if (aciertos >= 10) notaKey = 'a';
            else if (aciertos >= 6) notaKey = 'b';
            else if (aciertos >= 3) notaKey = 'c';

            document.getElementById('res-nota').textContent = t.notas[notaKey];
        }

        function mostrarPantallaGameOver() {
            const lang = obtenerIdiomaActual();
            const t = i18n[lang];

            document.getElementById('opciones-container').classList.add('hidden');
            document.getElementById('gameover-container').classList.remove('hidden');

            document.getElementById('txt-gameover-titulo').textContent = t.gameOverTitulo;
            document.getElementById('txt-gameover-sub').textContent = t.gameOverSub;
            document.getElementById('res-aciertos').textContent = puntuacionAciertos;
            document.getElementById('res-tiempo').textContent = document.getElementById('tiempo-transcurrido').textContent;

            actualizarNotaUI(puntuacionAciertos, t);
        }

        function actualizarRacha(ganado) {
            let racha = parseInt(localStorage.getItem('real_racha') || '0', 10);
            if (ganado) {
                racha++;
            } else {
                racha = 0;
            }
            localStorage.setItem('real_racha', racha);
            document.getElementById('current-streak-num').textContent = racha;
        }

        function iniciarCronometro() {
            tiempoSegundos = 0;
            document.getElementById('tiempo-transcurrido').textContent = "00:00";
            if (intervaloCronometro) clearInterval(intervaloCronometro);
            
            intervaloCronometro = setInterval(() => {
                tiempoSegundos++;
                const mins = String(Math.floor(tiempoSegundos / 60)).padStart(2, '0');
                const secs = String(tiempoSegundos % 60).padStart(2, '0');
                document.getElementById('tiempo-transcurrido').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function detenerCronometro() {
            if (intervaloCronometro) clearInterval(intervaloCronometro);
        }

        function compartirResultado() {
            const lang = obtenerIdiomaActual();
            const textoCompartir = `REAL Game - Survival Mode\n🔥 I survived and got ${puntuacionAciertos} correct facts in ${document.getElementById('tiempo-transcurrido').textContent}!\nCan you beat my score?`;
            navigator.clipboard.writeText(textoCompartir).then(() => {
                alert(i18n[lang].copiadoExito);
            });
        }

        window.onload = () => {
            document.getElementById('current-streak-num').textContent = localStorage.getItem('real_racha') || '0';
            reiniciarPartidaCompleta();
        };
    </script>
</body>
</html>
